# Minimal Mosquitto configuration for local/edge use.
#
# NOTE ON SECURITY: allow_anonymous is set to true to keep this demo simple
# to run and test out of the box. For any real deployment, disable
# anonymous access and configure a password file / TLS certificates —
# see the "Security notes" section in the top-level README.

listener 1883
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
