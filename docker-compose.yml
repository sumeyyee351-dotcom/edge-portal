services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: edge-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -t '$$SYS/#' -C 1 -i healthcheck -W 3 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  edge-portal:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: edge-portal
    depends_on:
      - mosquitto
    ports:
      - "8080:8080"
    environment:
      MQTT_BROKER: tcp://mosquitto:1883
      MQTT_TOPIC: devices/edge01/telemetry
      MQTT_CLIENT_ID: edge-portal
      DEVICE_NAME: Edge Device 01
      HTTP_PORT: 8080
    restart: unless-stopped

volumes:
  mosquitto-data:
  mosquitto-log:
